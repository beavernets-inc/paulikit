name: preflight

# First feedback on every pull request, together with the DCO app.
# Cheap and fast, needs no approval; the tests wait for a reviewer
# (see the ci environment in ci.yml).
on:
  pull_request: {}

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install nbformat
        run: python -m pip install nbformat

      - name: Run preflight checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/preflight "$BASE_SHA" "$HEAD_SHA"

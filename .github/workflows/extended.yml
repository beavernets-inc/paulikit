name: extended

# Platforms and dependency extremes too slow or too fragile to gate
# every pull request. NOT required for merging: nothing here feeds
# the ci-result check in ci.yml.
#
#   containers   Fedora (latest), Debian testing and Alpine (musl)
#                containers, with the distribution toolchain and
#                oneTBB
#   freebsd      FreeBSD in a VM, everything from system packages
#   s390x        big-endian IBM Z under QEMU emulation, distribution
#                packages only; allowed to fail, and slow
#   python       Python 3.14, and the oldest NumPy and SciPy that
#                pyproject.toml declares support for
#
# Each job reports whether the native extension was BUILT or fell
# back to pure Python. Fedora, Debian, FreeBSD, s390x, Python 3.14
# and the oldest-dependencies job require BUILT. Alpine only reports:
# musl is where the compiled kernels' glibc-oriented probes are least
# certain, and the outcome is information, not a failure.
#
# Runs weekly and on demand ("Run workflow" on the Actions tab, or
# `gh workflow run extended.yml`). It also runs on a pull request, but
# only one that changes this file, behind the same reviewer approval
# as ci.yml, so a change to it is validated before it merges.
on:
  pull_request:
    paths:
      - ".github/workflows/extended.yml"
      - ".github/scripts/ext-container"
      - ".github/scripts/ext-freebsd"
      - ".github/scripts/native-outcome"
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: extended-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approve:
    # "Review deployments" on the run page, select ci, approve.
    name: reviewer approval
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - run: echo "extended CI approved for ${{ github.sha }}"

  containers:
    name: "container / ${{ matrix.image }}"
    needs: approve
    if: >-
      !cancelled() &&
      (needs.approve.result == 'success' ||
       (github.event_name != 'pull_request' &&
        needs.approve.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            distro: fedora
            expect: BUILT
          - image: debian:testing
            distro: debian
            expect: BUILT
          # musl libc. NumPy and SciPy come from the musllinux
          # wheels; the script falls back to Alpine's own packages
          # if pip finds none for the interpreter in the image.
          - image: alpine:latest
            distro: alpine
            expect: any
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # docker run rather than a `container:` job: the runner's
      # JavaScript actions need a glibc Node, which Alpine lacks.
      - name: Build and test in the container
        env:
          IMAGE: ${{ matrix.image }}
          DISTRO: ${{ matrix.distro }}
          EXPECT: ${{ matrix.expect }}
        run: >-
          docker run --rm -e EXPECT -v "$PWD:/src:ro" "$IMAGE"
          sh /src/.github/scripts/ext-container "$DISTRO"

  freebsd:
    name: "FreeBSD"
    needs: approve
    if: >-
      !cancelled() &&
      (needs.approve.result == 'success' ||
       (github.event_name != 'pull_request' &&
        needs.approve.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        env:
          EXPECT: BUILT
        with:
          envs: EXPECT
          usesh: true
          run: sh .github/scripts/ext-freebsd

  s390x:
    # Big-endian, emulated. Slow (the compile and the suite run an
    # order of magnitude or more slower than native), so it is
    # allowed to fail and has a long limit; a red mark here is
    # information about byte-order assumptions, not a blocker.
    name: "s390x (QEMU, big-endian)"
    needs: approve
    if: >-
      !cancelled() &&
      (needs.approve.result == 'success' ||
       (github.event_name != 'pull_request' &&
        needs.approve.result == 'skipped'))
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: s390x

      - name: Build and test in an emulated s390x container
        env:
          EXPECT: BUILT
          EXPECT_BYTEORDER: big
        run: >-
          docker run --rm --platform linux/s390x
          -e EXPECT -e EXPECT_BYTEORDER
          -v "$PWD:/src:ro" debian:stable
          sh /src/.github/scripts/ext-container debian-system

  python:
    name: "${{ matrix.name }}"
    needs: approve
    if: >-
      !cancelled() &&
      (needs.approve.result == 'success' ||
       (github.event_name != 'pull_request' &&
        needs.approve.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Python 3.14"
            python-version: "3.14"
            numpy: numpy
            scipy: scipy
            pinned: false
          # The minimum versions pyproject.toml declares (numpy>=1.24,
          # scipy>=1.10). NumPy 1.24 and SciPy 1.10 publish wheels
          # only up to Python 3.11, so this runs on 3.10, the oldest
          # interpreter the package supports.
          - name: "oldest NumPy and SciPy (Python 3.10)"
            python-version: "3.10"
            numpy: "numpy==1.24.*"
            scipy: "scipy==1.10.*"
            pinned: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check the pins still match pyproject.toml
        # The oldest-dependencies pins above are written out by hand;
        # fail loudly if the declared minimum moves so they get
        # updated with it rather than silently testing a stale floor.
        if: matrix.pinned
        run: |
          if ! grep -qF '"numpy>=1.24"' pyproject.toml \
              || ! grep -qF '"scipy>=1.10"' pyproject.toml; then
            echo "::error::declared minimum changed; update the pins"
            exit 1
          fi

      - name: Install oneTBB
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev

      - name: Install build dependencies
        env:
          NUMPY: ${{ matrix.numpy }}
          SCIPY: ${{ matrix.scipy }}
        run: >-
          python -m pip install --upgrade
          pip "$NUMPY" "$SCIPY" meson-python cython ninja

      - name: Install paulikit with test extras
        run: >-
          pip install -e ".[test]" --no-build-isolation
          -Csetup-args=-Dnative=enabled
          -Csetup-args=-Dwht_kernel=enabled
          -Csetup-args=-Dcache_probe=enabled

      - name: Run the test suite
        run: pytest -v -m "not slow"

      - name: Report whether the native extension was built
        env:
          EXPECT: BUILT
        run: python .github/scripts/native-outcome

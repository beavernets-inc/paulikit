name: ci

# The test suite, in one workflow with one approval per push.
#
#   approve    waits for a reviewer to approve the `ci` environment;
#              pull requests only
#   test       pytest on Python 3.10-3.13 Linux x86_64, plus Linux
#              ARM64, macOS (Apple silicon and Intel) and Windows on
#              3.12
#   sanitize   the native extension built with AddressSanitizer and
#              UndefinedBehaviorSanitizer, non-slow suite on 3.12
#   ci-result  always runs; passes only if every needed job passed or
#              was skipped. This is the check branch protection
#              requires.
#
# Linux, macOS and the sanitizer job build the native extension as
# REQUIRED
# (-Dnative=enabled, plus wht_kernel and cache_probe), so a green tick
# cannot silently mean "fallback only". Windows builds with all three
# DISABLED so the documented pure-Python fallback stays tested, and
# the last step of every job fails if the outcome (BUILT or FALLBACK)
# is not the one the matrix expects.
#
# The platforms that run only weekly (distribution containers, musl,
# FreeBSD, big-endian s390x, Python 3.14, oldest dependencies) are in
# extended.yml and are not required for merging.
#
# Every third-party action is pinned to a full commit SHA with its
# version in a comment, so a moved or compromised tag cannot change
# what runs. Bump the SHA and the comment together.
#
# Scheduled weekly on main, because the tests install current
# dependency releases and can break with no pull request at all.
# Scheduled and manual runs need no approval: they run code already
# on a branch of this repository.
on:
  pull_request: {}
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # A new push supersedes a run still waiting for approval.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approve:
    # "Review deployments" on the run page, select ci, approve.
    name: reviewer approval
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - run: echo "CI approved for ${{ github.sha }}"

  test:
    name: "py${{ matrix.python-version }} / ${{ matrix.os }}"
    needs: approve
    if: >-
      !cancelled() &&
      (needs.approve.result == 'success' ||
       (github.event_name != 'pull_request' &&
        needs.approve.result == 'skipped'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # native: value of the meson feature options native,
        # wht_kernel and cache_probe ("enabled" fails the build if a
        # compiled kernel cannot be built; "disabled" builds none).
        # expect: what the final step must find.
        native: [enabled]
        expect: [BUILT]
        include:
          # CPU pinning and topology detection are Linux-only
          # (sched_setaffinity, /sys/devices/system/cpu); macOS and
          # Windows test the degraded-but-correct paths. Windows
          # also has no oneTBB here and builds no native code, so
          # the pure-Python fallback is tested on a real platform.
          - os: macos-latest
            python-version: "3.12"
            native: enabled
            expect: BUILT
          # macos-latest is Apple silicon; the Intel runner is the
          # only place the x86_64 dispatch (AVX2, POPCNT) runs on
          # macOS under Apple clang. Linux ARM64 runs the NEON path
          # and the ARM64 probes natively, not under emulation.
          - os: macos-15-intel
            python-version: "3.12"
            native: enabled
            expect: BUILT
          - os: ubuntu-24.04-arm
            python-version: "3.12"
            native: enabled
            expect: BUILT
          - os: windows-latest
            python-version: "3.12"
            native: disabled
            expect: FALLBACK
    env:
      NATIVE: ${{ matrix.native }}
      EXPECT: ${{ matrix.expect }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install oneTBB (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev

      - name: Install oneTBB (macOS)
        if: runner.os == 'macOS'
        run: brew install tbb

      - name: Install build dependencies
        # Installed first and separately so the editable install can
        # use --no-build-isolation: meson-python bakes NumPy's include
        # path into the rebuild hook, and with build isolation that
        # path points into a throwaway environment that is deleted
        # immediately afterwards.
        run: >-
          python -m pip install --upgrade
          pip numpy meson-python cython ninja

      - name: Install paulikit with test extras
        shell: bash
        run: >-
          pip install -e ".[test]" --no-build-isolation
          -Csetup-args=-Dnative="$NATIVE"
          -Csetup-args=-Dwht_kernel="$NATIVE"
          -Csetup-args=-Dcache_probe="$NATIVE"

      - name: Run the test suite
        # -m 'not slow' matches pyproject's default addopts; the slow
        # marker covers reference comparisons that take minutes.
        run: pytest -v -m "not slow"

      - name: Report whether the native extension was built
        # Fails if the outcome differs from the matrix's `expect`
        # (BUILT on Linux and macOS, FALLBACK on Windows), so neither
        # path can silently stop being the one that is tested.
        shell: bash
        run: |
          python - <<'PY'
          import os
          try:
              from paulikit._native import pauli_label_native  # noqa: F401
              outcome = "BUILT"
              detail = ""
          except ImportError as exc:
              outcome = "FALLBACK"
              detail = f" ({exc})"
          expected = os.environ["EXPECT"]
          print(f"native extension: {outcome}{detail}; expected {expected}")
          if outcome != expected:
              raise SystemExit(
                  f"native extension: got {outcome}, expected {expected}"
              )
          PY

  sanitize:
    # AddressSanitizer and UndefinedBehaviorSanitizer over the
    # compiled kernels, running the non-slow suite. The best
    # bugs-per-minute check for hand-written C and SIMD code.
    name: "sanitizers (ASan + UBSan) / py3.12"
    needs: approve
    if: >-
      !cancelled() &&
      (needs.approve.result == 'success' ||
       (github.event_name != 'pull_request' &&
        needs.approve.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install oneTBB
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev

      - name: Install build dependencies
        run: >-
          python -m pip install --upgrade
          pip numpy meson-python cython ninja

      - name: Install paulikit built with sanitizers
        # b_lundef=false lets the extension modules link with
        # undefined symbols that the sanitizer runtime resolves at
        # load time (the interpreter itself is not instrumented).
        # debugoptimized keeps frames and line numbers in the
        # reports at a speed the suite can tolerate. A fixed build
        # directory lets the later steps find it.
        run: >-
          pip install -e ".[test]" --no-build-isolation
          -Cbuild-dir=build-sanitize
          -Csetup-args=-Dnative=enabled
          -Csetup-args=-Dwht_kernel=enabled
          -Csetup-args=-Dcache_probe=enabled
          -Csetup-args=-Db_sanitize=address,undefined
          -Csetup-args=-Db_lundef=false
          -Csetup-args=-Dbuildtype=debugoptimized

      - name: Run the test suite under the sanitizers
        # The interpreter is not built with ASan, so the runtime the
        # compiler used must be loaded first via LD_PRELOAD.
        # detect_leaks=0: CPython keeps allocations alive at exit by
        # design, which LeakSanitizer would report on every run.
        # halt_on_error=1 turns the first undefined-behaviour report
        # into a failure instead of a log line. -s keeps pytest from
        # capturing stderr: a sanitizer abort would otherwise take
        # the report down with the process.
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          export LD_PRELOAD
          echo "preloading $LD_PRELOAD"
          python - <<'PY'
          import importlib.util
          import subprocess
          import sys
          spec = importlib.util.find_spec("paulikit._native.wht_native")
          if spec is None or spec.origin is None:
              raise SystemExit("wht_native extension not found")
          libs = subprocess.run(
              ["ldd", spec.origin], capture_output=True, text=True,
              env={"PATH": "/usr/bin:/bin"}, check=True,
          ).stdout
          if "libasan" not in libs or "libubsan" not in libs:
              sys.stdout.write(libs)
              raise SystemExit("extension is not linked with the sanitizers")
          print("extension is linked with ASan and UBSan")
          PY
          python -m pytest -s -v -m "not slow"

  ci-result:
    name: ci-result
    needs: [approve, test, sanitize]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: >-
            approve=${{ needs.approve.result }}
            test=${{ needs.test.result }}
            sanitize=${{ needs.sanitize.result }}
        run: |
          status=0
          for r in $RESULTS; do
            echo "$r"
            case "${r#*=}" in
              success|skipped) ;;
              *) status=1 ;;
            esac
          done
          exit "$status"

[build-system]
requires = ["meson-python>=0.16", "Cython>=3.0", "numpy>=1.24"]
build-backend = "mesonpy"

[project]
name = "paulikit"
version = "0.1.2"
description = "Pauli-basis decomposition of large operators: fast Walsh-Hadamard transform in C, bounded memory, multi-core"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
# Ships the licence TEXT alongside the licence claim above. Without
# it the built sdist and wheel assert GPL-3.0-or-later while carrying
# no copy of it, so a PyPI or Zenodo consumer receives source with no
# licence.
license-files = ["LICENSE"]
# Names only, with the project address as the maintainer contact.
# Giving one author an email and the others none splits them across
# the Author and Author-Email metadata fields, which renders as two
# unrelated lists on PyPI. A project address also survives people
# changing roles and publishes no individual's address.
authors = [
    { name = "Mohammadreza Khellat" },
    { name = "Mohammad Masoumi" },
    { name = "Saman Nasoori" },
    { name = "Soroush Nasoori" },
]
maintainers = [
    { name = "paulikit developers", email = "dev@beavernets.com" },
]
keywords = [
    "quantum-computing",
    "pauli-decomposition",
    "pauli-matrices",
    "hamiltonian",
    "hamiltonian-simulation",
    "computational-physics",
    "linear-algebra",
    "walsh-hadamard-transform",
    "fwht",
    "high-performance-computing",
    "parallel-computing",
    "performance-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: C",
    # Linux specifically, not "OS Independent": the cache-latency
    # probe and CPU-feature detection read Linux interfaces, and the
    # non-Linux fallbacks are not yet exercised in CI. The pure-Python
    # path is portable; the tested claim is not.
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
sparse = [
    "scipy>=1.10",
]
test = [
    "pytest>=7",
    "pennylane>=0.35",
    "scipy>=1.10",
]
dev = [
    "pytest>=7",
    "pennylane>=0.35",
    "scipy>=1.10",
    "cython>=3.0",
    "ruff",
]
docs = [
    "sphinx>=7",
    "furo",
    "myst-parser>=2",
    "sphinx-autodoc-typehints>=2",
]

[project.urls]
Homepage = "https://codeberg.org/beavernets/paulikit"
Repository = "https://codeberg.org/beavernets/paulikit"
Documentation = "https://codeberg.org/beavernets/paulikit/src/branch/main/docs/index.md"
"Issue tracker" = "https://codeberg.org/beavernets/paulikit/issues"
# Mirror used for manylinux wheel CI (GitHub-hosted Docker runners).
Mirror = "https://github.com/beavernets-inc/paulikit"

[project.scripts]
paulikit = "paulikit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: benchmark and reference comparisons that take minutes to run; excluded by default via addopts below, run them with -m slow",
]
addopts = "-m 'not slow'"
# CPython 3.12+ warns when os.fork() runs in a multi-threaded process.
# Under pytest that is routine here: NumPy/OpenBLAS (and earlier
# ThreadPoolExecutor drain tests) leave worker threads alive, then
# executor="process" uses ProcessPoolExecutor's default Linux start
# method (fork) for the pinned-worker path. The warning is upstream
# noise, not a paulikit correctness failure; forkserver was tried and
# hit handshake failures with this initializer/pickling shape. Silence
# only that specific DeprecationWarning.
filterwarnings = [
    "ignore:This process \\(pid=.*\\) is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child:DeprecationWarning",
]

[tool.ruff]
line-length = 92
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.cibuildwheel]
# Scope for the first release: Linux glibc x86_64 and aarch64, CPython
# 3.10-3.13. musllinux, macOS, and Windows are covered by the sdist
# rather than by wheels: the cache-latency probe and CPU-feature
# detection read Linux/glibc interfaces, and their fallbacks are not
# yet exercised on those platforms. Shipping wheels for a platform
# nothing tests would claim more than has been verified. configure
# reports the musllinux skip explicitly when run on a musl host.
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux* *_i686 *-win* *-macosx*"
archs = ["auto64"]
# scipy is required by the exhaustive-verification tests (module-level
# import); pennylane is importorskip'd. Keep the wheel test set lean.
test-requires = ["pytest>=7", "scipy>=1.10"]
# Import gate lives in test-command (not before-test): cibuildwheel v4
# creates the test venv and runs before-test *before* installing the
# repaired wheel, so "import paulikit" there fails with ModuleNotFound.
test-command = "python -c \"from paulikit._native import wht_native, coeffs_native, gather_native, pauli_label_native\" && pytest {package}/tests -m 'not slow'"

# Serial pauli_label_native needs only C + Cython (same as wht_kernel).
# Do not force -Dnative=disabled: wheels should ship the serial label
# kernel. The optional oneTBB parallel module is simply absent on
# manylinux when tbb-devel is not installed — that is intentional;
# parallel_labels falls back to serial with identical results.

# wht_kernel modules (wht_native, coeffs_native, gather_native,
# hermitian_check_native), cache_probe, and serial pauli_label_native
# need only a C compiler and Cython. The import line in test-command
# fails the job if those are missing from the installed wheel.

[tool.cibuildwheel.linux]
# No before-all TBB install: wheels ship serial pauli_label only.
# oneTBB parallel fill remains a from-source optional module.
